name: Release

# Ein Tag wie v0.2.0 pushen -> ZIP bauen und GitHub-Release erstellen.
# Die Version in der ZIP-.toc wird automatisch aus dem Tag gesetzt.
# Manuell starten (workflow_dispatch) -> nur ZIP bauen, als Workflow-Artefakt zum Testen.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ADDON: ForeverUnitFrames

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Die Version kommt aus dem Tag (v0.3.0 -> 0.3.0), bei manuellem Start "dev-<commit>"
      - name: Version bestimmen
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: ZIP bauen
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="$ADDON-$VERSION.zip"
          mkdir -p "build/$ADDON"
          cp "$ADDON.toc" *.lua "build/$ADDON/"
          # Version in die .toc der ZIP schreiben (die .toc im Repo bleibt unverändert)
          sed -i "s/^## Version:.*/## Version: $VERSION/" "build/$ADDON/$ADDON.toc"
          grep '^## Version:' "build/$ADDON/$ADDON.toc"
          mkdir -p "build/$ADDON/Media"
          cp Media/*.tga "build/$ADDON/Media/"
          (cd build && zip -r -9 "../$ZIP" "$ADDON")
          unzip -l "$ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: ZIP als Artefakt ablegen
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.zip.outputs.file }}
          path: ${{ steps.zip.outputs.file }}

      - name: Release erstellen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.file }}" \
            --title "$ADDON ${{ steps.version.outputs.version }}" \
            --generate-notes
